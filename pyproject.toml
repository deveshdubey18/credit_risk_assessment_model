[project]
name = "credit-risk-assessment-ml-model"
version = "1.0.0"
description = "This is a Credit risk assessment Machine learning model"
readme = "README.md"
authors = [
    { name = "deveshdubey18", email = "314devesh11scic@gmail.com" }
]
requires-python = ">=3.13,<=3.14"
dependencies = [
    "autogluon-tabular>=1.6.3",
    "flaml[automl]>=2.7.0",
    "imblearn>=0.0",
    "ipykernel>=7.4.0",
    "logging>=0.4.9.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>2.0.0,<2.4.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.10,<2.11",
]

[project.scripts]
credit-risk-assessment-ml-model = "credit_risk_assessment_ml_model:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
